<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>WarZone — Slot Asset Generator</title>
  <style>
    body { background:#111; color:#eee; font-family:Arial,sans-serif; padding:20px; }
    input, button { padding:8px; margin:5px 0; }
    .preview img { max-width:100%; margin:10px 0; border:2px solid #555; }
    pre { background:#222; padding:10px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>WarZone — Slot Asset Generator</h1>

  <label>Prompt:</label><br>
  <input id="prompt" type="text" value="Symbol A w stylu wojskowym z granatem" style="width:100%"><br>

  <button onclick="generate()">Generuj obraz</button>

  <div class="preview" id="preview"></div>

  <script>
    const proxyUrl = "https://slot-generator.onrender.com/generate"; // Twój backend na Render

    async function generate(){
      const prompt = document.getElementById('prompt').value;
      document.getElementById('preview').innerHTML = '<p>Generowanie...</p>';

      try {
        const res = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt, size: '1024x1024' }) // ✅ zmieniono rozmiar
        });

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (err) {
          document.getElementById('preview').innerHTML = `<p>Niepoprawny JSON z backendu:</p><pre>${text}</pre>`;
          return;
        }

        console.log("Odpowiedź backendu:", data);

        // Obsłuż odpowiedź w formacie OpenAI (data.data[0].url)
        let imageUrl = null;
        if(data.url){
          imageUrl = data.url;
        } else if(data.data && data.data[0] && data.data[0].url){
          imageUrl = data.data[0].url;
        }

        if(imageUrl){
          document.getElementById('preview').innerHTML = `<img src="${imageUrl}" alt="Obraz AI">`;
        } else {
          document.getElementById('preview').innerHTML = `<p>Brak adresu obrazka w odpowiedzi. Oto pełna odpowiedź backendu:</p><pre>${JSON.stringify(data,null,2)}</pre>`;
        }
      } catch (e){
        document.getElementById('preview').innerHTML = `<p>Błąd połączenia z backendem:</p><pre>${e}</pre>`;
      }
    }
  </script>
</body>
</html>
